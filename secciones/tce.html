<!-- 1. LA MAQUETACIÓN (HTML) -->
<div class="cabecera-editorial">
    <span class="pildora">Especialidad</span>
    <h1>Técnico en Cuidados Auxiliares de Enfermería (TCE)</h1>
    <p>Bloque de temas específicos oficiales para la preparación de exámenes.</p>
</div>

<!-- Contenedor donde tu script pintará las tarjetas -->
<div class="grid-temas" id="gridTemasTCE"></div>


<!-- 2. LOS ESTILOS (CSS) -->
<style>
    .grid-temas {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
        margin-top: 20px;
        width: 100%;
    }
    
    .tarjeta-tema {
        background-color: var(--bg-tarjeta);
        border: 1px solid var(--borde);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 14px;
        transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .tarjeta-tema:hover {
        transform: translateY(-2px);
        border-color: var(--color-termino);
    }

    .tarjeta-header h3 {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--color-text-primary);
        line-height: 1.4;
    }

    .tarjeta-body p {
        font-size: 0.88rem;
        color: var(--color-text-secondary);
        line-height: 1.5;
    }

    .tarjeta-footer {
        display: flex;
        gap: 10px;
        margin-top: auto;
    }

    .btn-test {
        flex: 1;
        text-align: center;
        padding: 10px 12px;
        font-size: 0.85rem;
        font-weight: 500;
        text-decoration: none;
        border-radius: 6px;
        font-family: 'Poppins', sans-serif;
        background-color: var(--color-bg-indigo);
        color: var(--color-termino);
        transition: all 0.2s ease;
    }

    .btn-test:hover {
        background-color: var(--color-termino);
        color: var(--color-surface);
    }

    .btn-test.disabled {
        opacity: 0.3;
        pointer-events: none;
    }
</style>

        // Función encargada del pintado físico de elementos
        function renderizarTarjetasTCE(contenedor) {
            contenedor.innerHTML = listadoTemas.map(tema => {
                const datosRepaso = (tema.enlaces && tema.enlaces.length > 0) ? tema.enlaces[0] : null;
                const datosExterno = (tema.enlaces && tema.enlaces.length > 1) ? tema.enlaces[1] : null;

                const claseRepaso = (datosRepaso && datosRepaso.url) ? "" : "disabled";
                const claseExterno = (datosExterno && datosExterno.url) ? "" : "disabled";

                return `
                    <div class="tarjeta-tema">
                        <div class="tarjeta-header">
                            <h3>${tema.titulo}</h3>
                        </div>
                        <div class="tarjeta-body">
                            <p>${tema.definicion}</p>
                        </div>
                        <div class="tarjeta-footer">
                            <a href="${claseRepaso === "" ? datosRepaso.url : '#'}" class="btn-test btn-repaso ${claseRepaso}">
                                ${datosRepaso ? datosRepaso.texto : 'Test de Repaso'}
                            </a>
                            <a href="${claseExterno === "" ? datosExterno.url : '#'}" class="btn-test btn-externo ${claseExterno}">
                                ${datosExterno ? datosExterno.texto : 'Test Externos'}
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- SONDA DE CONTROL PARA ASINCRONISMO ---
        const targetInicial = document.getElementById('gridTemasTCE');
        if (targetInicial) {
            renderizarTarjetasTCE(targetInicial);
        } else {
            const observador = new MutationObserver((mutaciones, obs) => {
                const elementoDestino = document.getElementById('gridTemasTCE');
                if (elementoDestino) {
                    renderizarTarjetasTCE(elementoDestino);
                    obs.disconnect(); 
                }
            });
            observador.observe(document.body, { childList: true, subtree: true });
        }
    })();
